name: Woyengi ME111 Android asset gate

on:
  pull_request:
    branches:
      - main
      - fix/me111-native-port-descriptors-20261122
    paths:
      - 'packages/predictive-sdk/android/**'
      - '.github/workflows/woyengi-me111-android-asset-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android-compatible Java 8 source and run adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          build_dir="${RUNNER_TEMP}/woyengi-me111-asset-gate"
          mkdir -p "$build_dir"
          javac --release 8 -Xlint:all,-options -Werror -d "$build_dir" \
            packages/predictive-sdk/android/src/main/java/org/woyengi/predictive/me111/Me111FrozenModelAsset.java \
            packages/predictive-sdk/android/src/test/java/org/woyengi/predictive/me111/Me111FrozenModelAssetTest.java
          java -cp "$build_dir" org.woyengi.predictive.me111.Me111FrozenModelAssetTest
