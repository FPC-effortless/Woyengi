name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.12.0
          cache: true
          install: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          python --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Enforce package boundaries
        run: pnpm boundaries

      - name: Run Node and Python tests
        run: pnpm test:all

      - name: Run adversarial benchmark
        run: pnpm benchmark

      - name: Run automated architecture gate
        run: pnpm prod:check:fast --gate architecture --run-id ci-architecture

      - name: Run automated security gate
        run: pnpm prod:check:fast --gate security --run-id ci-security

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag woyengi-ci -f deploy/docker/Dockerfile .

      - name: Start API and check readiness
        env:
          WOYENGI_API_TOKEN: ci-only-token-123456789
          WOYENGI_DATA_DIR: /data
        run: |
          container_id="$(docker run --detach             --env WOYENGI_API_TOKEN             --env WOYENGI_DATA_DIR             --publish 127.0.0.1:8080:8080             woyengi-ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  postgres:
    name: PostgreSQL transactional integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: woyengi_ci
          POSTGRES_PASSWORD: integration-only-ci-password
          POSTGRES_DB: woyengi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woyengi_ci -d woyengi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install isolated test driver
        run: npm install --prefix "$RUNNER_TEMP/woyengi-pg" --no-save --ignore-scripts pg@8.16.3

      - name: Test SQL transactions against live PostgreSQL
        env:
          WOYENGI_PG_MODULE_ROOT: ${{ runner.temp }}/woyengi-pg
          WOYENGI_TEST_DATABASE_URL: postgresql://woyengi_ci:integration-only-ci-password@127.0.0.1:5432/woyengi_ci
        run: node --test services/postgres-storage/test/postgres-live.test.ts services/postgres-storage/test/postgres-domain-live.test.ts services/selfhost-api/test/postgres-work-http-live.test.ts services/selfhost-api/test/postgres-sessions-live.test.ts services/selfhost-api/test/postgres-work-stream-live.test.ts services/compute-node/test/postgres-receipts-live.test.ts services/compute-node/test/postgres-hosted-state-live.test.ts services/compute-node/test/postgres-effect-verification-live.test.ts services/compute-node/test/postgres-quarantine-review-live.test.ts services/episode-context/test/postgres-knowledge-live.test.ts services/episode-context/test/postgres-gateway-live.test.ts services/episode-context/test/postgres-capability-live.test.ts
