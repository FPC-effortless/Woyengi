name: Woyengi local predictive SDK contract

on:
  push:
    branches:
      - company/woyengi-local-predictive-sdk-2026-10-30
      - company/sdk-deepfreeze-source-2026-10-30
      - company/sdk-constructed-quickstart-2026-10-31
  pull_request:
    branches:
      - feature/offline-only-predictive-export-2026-10-30
      - company/woyengi-local-predictive-sdk-2026-10-30
      - company/sdk-deepfreeze-source-2026-10-30
    paths:
      - 'packages/predictive-sdk/**'
      - '.github/workflows/predictive-sdk-contract.yml'

permissions:
  contents: read

jobs:
  local-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run constructed local prediction and source-export tests
        run: |
          node --test packages/predictive-export/test/export.test.ts
          node --test packages/predictive-sdk/test/local.test.ts
          node packages/predictive-sdk/examples/constructed_quickstart.ts
          node --test packages/predictive-sdk/test/quickstart.test.ts
      - name: Full local type and boundary checks
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm boundaries
      - name: Full Node and Python regression suite
        run: corepack pnpm test:all
