name: Woyengi ME111 runtime source pin

on:
  push:
    branches:
      - feat/me111-runtime-source-pin-20261128
    paths:
      - 'packages/predictive-sdk/**'
      - '.github/workflows/me111-runtime-source-pin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out immutable TAC-OSM Android runtime source
        uses: actions/checkout@v4
        with:
          repository: FPC-effortless/TAC-OSM
          ref: eda076507f5762fa4413848cd3f0fd87a55c3681
          path: pinned-me111
          persist-credentials: false
      - name: Run constructed bridge and exact upstream source-contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/predictive-sdk/test/me111-bridge.test.ts
          ME111_PINNED_ANDROID_SOURCE="$GITHUB_WORKSPACE/pinned-me111" \
            node --test packages/predictive-sdk/test/me111-upstream-contract.test.ts
      - name: Install pinned workspace and check types/boundaries
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm boundaries
