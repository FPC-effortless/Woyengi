name: WIL-RBS contract checks
on:
  pull_request:
    paths:
      - 'research/wil-rbs/**'
      - '.github/workflows/wil-rbs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: python -m unittest discover -s research/wil-rbs/tests -v
      - name: Validate historical examples
        run: python research/wil-rbs/wil_rbs.py validate research/wil-rbs/examples/historical_aggregates.json
