name: Veritas SRE v4 Private Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/veritas-sre-v4-private-evidence.yml"
      - "private/veritas/sre-v4/**"

permissions:
  contents: read

concurrency:
  group: veritas-sre-v4-private-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private evaluator enclave
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reconstruct sealed qualification object
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path("private/veritas/sre-v4/qualification.json.gz.b64")
          target = Path("${{ runner.temp }}") / "sre-v4-qualification.json"
          target.write_bytes(gzip.decompress(base64.b64decode(src.read_text(encoding="utf-8"))))
          print(target)
          PY

      - name: Fetch exact Veritas commercial candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/FPC-effortless/veritas.git "$RUNNER_TEMP/veritas"
          git -C "$RUNNER_TEMP/veritas" checkout 37c818afb9d2f4fbeaefebf0fc07089f292e9a54

      - name: Install Veritas and CPU model runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "$RUNNER_TEMP/veritas"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" accelerate sentencepiece

      - name: Verify frozen release identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "${{ runner.temp }}/veritas/src")
          from investigation_world.commercial.sre_release import load_sealed_sre_release
          q = Path("${{ runner.temp }}") / "sre-v4-qualification.json"
          release = load_sealed_sre_release(
              q,
              expected_candidate_id="SRE-CAND-92A84929AD1E82E24357",
              expected_evidence_manifest_id="EVID-2C69B48DCDD5F2232EABDC9B",
              expected_report_id="QREPORT-C585121E94D91766BB6664E3",
              expected_panel_id="QPANEL-AFF065BA4C2FD75BE9BB3EBE",
              expected_private_release_manifest_id="PRIVREL-036192DA63716D331C929C0C",
          )
          assert len(release.private_release_manifest.private_test_scenario_ids) == 30
          print("sealed SRE v4 identities verified")
          PY

      - name: Evaluate Qwen2.5 0.5B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-reports" "$RUNNER_TEMP/public-evidence"
          cd "$RUNNER_TEMP/veritas"
          python tools/run_sre_open_model_evaluation.py \
            --qualification "$RUNNER_TEMP/sre-v4-qualification.json" \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --expected-candidate-id SRE-CAND-92A84929AD1E82E24357 \
            --expected-evidence-manifest-id EVID-2C69B48DCDD5F2232EABDC9B \
            --expected-report-id QREPORT-C585121E94D91766BB6664E3 \
            --expected-panel-id QPANEL-AFF065BA4C2FD75BE9BB3EBE \
            --expected-private-release-manifest-id PRIVREL-036192DA63716D331C929C0C \
            --max-new-tokens 32 \
            --output "$RUNNER_TEMP/private-reports/qwen2.5-0.5b.json" \
            --public-output "$RUNNER_TEMP/public-evidence/qwen2.5-0.5b.json"

      - name: Evaluate SmolLM2 360M
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/veritas"
          python tools/run_sre_open_model_evaluation.py \
            --qualification "$RUNNER_TEMP/sre-v4-qualification.json" \
            --model HuggingFaceTB/SmolLM2-360M-Instruct \
            --expected-candidate-id SRE-CAND-92A84929AD1E82E24357 \
            --expected-evidence-manifest-id EVID-2C69B48DCDD5F2232EABDC9B \
            --expected-report-id QREPORT-C585121E94D91766BB6664E3 \
            --expected-panel-id QPANEL-AFF065BA4C2FD75BE9BB3EBE \
            --expected-private-release-manifest-id PRIVREL-036192DA63716D331C929C0C \
            --max-new-tokens 32 \
            --output "$RUNNER_TEMP/private-reports/smollm2-360m.json" \
            --public-output "$RUNNER_TEMP/public-evidence/smollm2-360m.json"

      - name: Aggregate sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/veritas"
          python tools/aggregate_sre_model_evaluations.py \
            --input "$RUNNER_TEMP/public-evidence"/*.json \
            --qualification "$RUNNER_TEMP/sre-v4-qualification.json" \
            --output "$RUNNER_TEMP/public-evidence/aggregate.json"

      - name: Enforce public evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}") / "public-evidence"
          files = sorted(root.glob("*.json"))
          assert len(files) >= 3
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert "cases" not in data, path
              assert data["candidate_id"] == "SRE-CAND-92A84929AD1E82E24357"
              assert data["panel_id"] == "QPANEL-AFF065BA4C2FD75BE9BB3EBE"
              assert data["evidence_manifest_id"] == "EVID-2C69B48DCDD5F2232EABDC9B"
              assert data["qualification_report_id"] == "QREPORT-C585121E94D91766BB6664E3"
              assert data["private_release_manifest_id"] == "PRIVREL-036192DA63716D331C929C0C"
          print("sanitized evidence contract verified")
          PY

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: veritas-sre-v4-sanitized-model-evidence
          path: ${{ runner.temp }}/public-evidence/*.json
          if-no-files-found: error
          retention-days: 90
