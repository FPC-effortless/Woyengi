name: Veritas Independent Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Veritas pull request number"
        required: true
        type: string
      expected_head_sha:
        description: "Exact 40-character Veritas PR head SHA"
        required: true
        type: string
      mode:
        description: "Dry-run emits the decision without writing a GitHub review"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - submit

permissions:
  contents: read

concurrency:
  group: veritas-independent-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted Woyengi reviewer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run reviewer falsifiers
        run: node --test scripts/veritas-independent-reviewer.test.mjs

      - name: Mint dedicated reviewer-app installation token
        id: reviewer-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VERITAS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.VERITAS_REVIEWER_PRIVATE_KEY }}
          owner: FPC-effortless
          repositories: veritas

      - name: Review exact Veritas head
        env:
          GITHUB_APP_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          SUBMIT_REVIEW: ${{ inputs.mode == 'submit' && 'true' || 'false' }}
        run: node scripts/veritas-independent-reviewer.mjs
